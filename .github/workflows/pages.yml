# Construit le jeu et le publie sur GitHub Pages à chaque push sur main.
# À activer une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # terser et acorn suffisent pour construire ; Playwright (tests) est optionnel et n'est pas installé ici
      - run: npm ci --omit=optional
      - run: npm run build
      - run: mkdir site && cp dist/index.html site/index.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
